<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelanggan — Admin Toko Albi Parfum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet" />
  <link href="css/admin.css" rel="stylesheet" />
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>
  <div class="admin-main-wrap flex-grow-1">
    <div id="admin-topbar"></div>
    <div class="admin-content">

      <div id="alert-container" class="mb-3"></div>

      <!-- Toolbar -->
      <div class="d-flex align-items-center gap-2 flex-wrap mb-3">
        <div class="admin-search" style="flex:1;min-width:200px;max-width:320px">
          <input type="text" id="search-input" placeholder="Nama, email, telepon…" />
          <button id="search-btn"><i class="bi bi-search"></i></button>
        </div>
      </div>

      <div class="admin-card">
        <div id="customers-table"></div>
      </div>

    </div>
  </div>
</div>

<!-- CUSTOMER DETAIL MODAL -->
<div class="modal fade" id="customerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detail Pelanggan</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="customer-detail-body">
        <div class="admin-loading"><span class="spinner-border spinner-border-sm me-2"></span>Memuat…</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-admin-outline" data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<script src="js/admin-auth.js"></script>
<script>
const customerModal = new bootstrap.Modal(document.getElementById('customerModal'));
let table;

document.addEventListener('DOMContentLoaded', () => {
  if (!AdminAuth.requireAuth()) return;
  AdminAuth.buildLayout('Pelanggan', 'customers');
  initTable();
  bindEvents();
});

function initTable() {
  table = new Tabulator('#customers-table', {
    ajaxURL: '/api/admin/customers',
    ajaxRequestFunc: function(url, config, params) {
      const p = { page: params.page || 1, per_page: params.size || 10 };
      const remoteFilters = params.filter || params.filters || [];
      const remoteSorters = params.sort || params.sorters || [];
      const search = document.getElementById('search-input').value.trim();
      if (search) p.search = search;
      if (remoteFilters.length) p.filters = JSON.stringify(remoteFilters);
      if (remoteSorters.length) p.sorters = JSON.stringify(remoteSorters);
      return axios.get(url, {
        headers: { 'Authorization': 'Bearer ' + AdminAuth.token(), 'Accept': 'application/json' },
        params: p,
      }).then(function(res) {
        const r = res.data;
        return { data: r.data ?? r, last_page: r.meta?.last_page ?? r.last_page ?? 1 };
      });
    },
    pagination: true,
    paginationMode: 'remote',
    filterMode: 'remote',
    sortMode: 'remote',
    paginationSize: 10,
    paginationSizeSelector: [10, 20, 50],
    layout: 'fitColumns',
    resizableColumns: true,
    placeholder: '<div class="admin-empty"><i class="bi bi-people"></i><br>Belum ada pelanggan</div>',
    columns: [
      {
        title: 'Pelanggan',
        field: 'name',
        headerFilter: 'input',
        formatter: function(cell) {
          const c = cell.getRow().getData();
          return `<div style="font-weight:600;font-size:0.85rem">${escA(c.name)}</div>
                  <div style="font-size:0.75rem;color:#888">${escA(c.email)}</div>`;
        },
        minWidth: 180,
      },
      {
        title: 'Telepon',
        field: 'phone',
        headerFilter: 'input',
        formatter: function(cell) {
          return `<span style="font-size:0.83rem">${escA(cell.getValue() || '—')}</span>`;
        },
        width: 140,
      },
      {
        title: 'Kota',
        field: 'city',
        headerFilter: 'input',
        formatter: function(cell) {
          return `<span style="font-size:0.83rem">${escA(cell.getValue() || '—')}</span>`;
        },
        width: 140,
      },
      {
        title: 'Bergabung',
        field: 'created_at',
        formatter: function(cell) {
          return `<span style="font-size:0.78rem;color:#888">${fmtDate(cell.getValue())}</span>`;
        },
        width: 140,
      },
      {
        title: '',
        field: 'id',
        headerSort: false,
        width: 120,
        formatter: function(cell) {
          return `<button class="btn-action btn-view" data-id="${cell.getValue()}" title="Detail Pelanggan"><i class="bi bi-eye"></i></button>`;
        },
        cellClick: function(e, cell) {
          const btn = e.target.closest('.btn-view');
          if (btn) openCustomerDetail(btn.dataset.id);
        },
      },
    ],
  });
}

function bindEvents() {
  const doSearch = debounce(() => table.setData(), 400);
  document.getElementById('search-input').addEventListener('input', doSearch);
  document.getElementById('search-btn').addEventListener('click', () => table.setData());
}

async function openCustomerDetail(id) {
  document.getElementById('customer-detail-body').innerHTML = '<div class="admin-loading"><span class="spinner-border spinner-border-sm me-2"></span>Memuat…</div>';
  customerModal.show();

  try {
    const res = await adminApi.get(`/customers/${id}`);
    const c = res.data.data || res.data;
    renderCustomerDetail(c);
  } catch(e) {
    document.getElementById('customer-detail-body').innerHTML = '<p class="admin-empty">Gagal memuat detail pelanggan</p>';
  }
}

function renderCustomerDetail(c) {
  const orders = c.orders || [];
  document.getElementById('customer-detail-body').innerHTML = `
    <div class="d-flex align-items-center gap-3 mb-3">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--admin-gold);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;color:#fff;flex-shrink:0">
        ${escA(c.name?.charAt(0)?.toUpperCase() || '?')}
      </div>
      <div>
        <div style="font-weight:700;font-size:1rem">${escA(c.name)}</div>
        <div style="color:#888;font-size:0.82rem">${escA(c.email)}</div>
      </div>
    </div>
    <table style="font-size:0.85rem;width:100%;margin-bottom:1rem">
      <tr><td style="color:#888;padding:0.25rem 0;width:120px">Telepon</td><td>${escA(c.phone || '—')}</td></tr>
      <tr><td style="color:#888;padding:0.25rem 0">Kota</td><td>${escA(c.city || '—')}</td></tr>
      <tr><td style="color:#888;padding:0.25rem 0">Provinsi</td><td>${escA(c.province || '—')}</td></tr>
      <tr><td style="color:#888;padding:0.25rem 0;vertical-align:top">Alamat</td><td style="font-size:0.82rem">${escA(c.address || '—')}</td></tr>
      <tr><td style="color:#888;padding:0.25rem 0">Bergabung</td><td>${fmtDate(c.created_at)}</td></tr>
    </table>
    ${orders.length ? `
      <hr>
      <p style="font-weight:600;font-size:0.88rem;margin-bottom:0.6rem">Riwayat Pesanan</p>
      <table class="admin-table">
        <thead><tr><th>No. Pesanan</th><th>Total</th><th>Status</th><th>Tanggal</th></tr></thead>
        <tbody>
          ${orders.slice(0,10).map(o => `
            <tr>
              <td style="font-size:0.8rem;color:var(--admin-gold)">${escA(o.order_number || o.id)}</td>
              <td style="font-size:0.82rem;font-weight:600">${fmtRp(o.grand_total || o.total)}</td>
              <td>${statusBadge(o.status)}</td>
              <td style="font-size:0.78rem;color:#888">${fmtDate(o.created_at)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    ` : '<div class="admin-empty" style="padding:1rem"><i class="bi bi-receipt"></i><br>Belum ada pesanan</div>'}
  `;
}

function debounce(fn, delay = 300) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
}
</script>

</body>
</html>
