<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — Toko Albi Parfum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/admin.css" rel="stylesheet" />
</head>
<body class="admin-login-body">

<div class="admin-login-card">
  <div class="admin-login-brand">Albi <span>Admin</span></div>
  <p class="admin-login-sub">Panel Manajemen Toko</p>

  <div id="alert-container"></div>

  <form id="login-form" novalidate>
    <div class="mb-3">
      <label class="admin-form-label">Email</label>
      <input type="email" id="field-email" class="admin-form-control" placeholder="Email" required autofocus />
    </div>
    <div class="mb-4">
      <label class="admin-form-label">Password</label>
      <div class="position-relative">
        <input type="password" id="field-password" class="admin-form-control pe-5" placeholder="••••••••" required />
        <button type="button" id="toggle-pw" class="position-absolute end-0 top-50 translate-middle-y border-0 bg-transparent pe-3" style="color:#888;cursor:pointer">
          <i class="bi bi-eye" id="pw-eye"></i>
        </button>
      </div>
    </div>
    <button type="submit" class="btn-admin-gold w-100 justify-content-center" id="btn-login" style="font-size:0.92rem;padding:0.7rem 0">
      <span id="btn-text"><i class="bi bi-shield-lock me-2"></i>Masuk</span>
      <span id="btn-loading" class="d-none">
        <span class="spinner-border spinner-border-sm me-2"></span>Memproses…
      </span>
    </button>
  </form>

  <p class="text-center mt-3" style="font-size:0.75rem;color:#aaa">
    <a href="/" style="color:#aaa"><i class="bi bi-arrow-left me-1"></i>Kembali ke Toko</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* Redirect if already logged in */
if (localStorage.getItem('albi_admin_token')) {
  location.href = 'dashboard';
}

function getApiBaseAdmin() {
  const path = window.location.pathname;
  let baseFolder = '/';
  if (path.includes('/public/')) {
    baseFolder = path.substring(0, path.indexOf('/public/') + 8);
  }
  const cleanBase = baseFolder.endsWith('/') ? baseFolder : baseFolder + '/';
  return window.location.origin + cleanBase + 'api/admin';
}

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  setLoading(true);

  const email    = document.getElementById('field-email').value.trim();
  const password = document.getElementById('field-password').value;

  try {
    const res = await axios.post(getApiBaseAdmin() + '/auth/login', { email, password }, {
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
    });

    localStorage.setItem('albi_admin_token', res.data.token);
    localStorage.setItem('albi_admin_user', JSON.stringify(res.data.user));
    if (res.data.user?.role) {
      localStorage.setItem('albi_admin_role', JSON.stringify(res.data.user.role));
    } else {
      localStorage.removeItem('albi_admin_role');
    }
    location.href = 'dashboard';
  } catch (err) {
    const msg = err.response?.data?.message || 'Login gagal. Periksa kembali kredensialmu.';
    document.getElementById('alert-container').innerHTML = `
      <div class="alert alert-danger" style="font-size:0.85rem">${msg}</div>
    `;
    setLoading(false);
  }
});

document.getElementById('toggle-pw').addEventListener('click', () => {
  const pw = document.getElementById('field-password');
  const eye = document.getElementById('pw-eye');
  if (pw.type === 'password') {
    pw.type = 'text';
    eye.className = 'bi bi-eye-slash';
  } else {
    pw.type = 'password';
    eye.className = 'bi bi-eye';
  }
});

function setLoading(on) {
  document.getElementById('btn-text').classList.toggle('d-none', on);
  document.getElementById('btn-loading').classList.toggle('d-none', !on);
  document.getElementById('btn-login').disabled = on;
}
</script>
</body>
</html>
