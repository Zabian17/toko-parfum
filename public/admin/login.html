<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — Toko Albi Parfum</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
  
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <style>
    :root {
      --bg-canvas: #0D0E11;
      --card-bg: #15161A;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-focus: #9E7A36;
      --input-bg: #0F1013;
      --input-border: rgba(255, 255, 255, 0.12);
      --gold-primary: #9E7A36;
      --gold-light: #C4A564;
      --gold-subtle: rgba(158, 122, 54, 0.15);
      --text-main: #FAF8F5;
      --text-muted: #8E8C87;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body.admin-login-body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(158, 122, 54, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 10% 80%, rgba(20, 22, 28, 0.8) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      margin: auto;
    }

    .admin-login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.03);
      padding: 2.5rem 2.25rem 2.25rem;
      position: relative;
      overflow: hidden;
    }

    /* Elegant top gold shimmer line */
    .admin-login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold-light), var(--gold-primary), transparent);
    }

    .badge-security {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(158, 122, 54, 0.1);
      border: 1px solid rgba(158, 122, 54, 0.25);
      color: var(--gold-light);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.9rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .brand-title span {
      color: var(--gold-light);
      font-style: italic;
      font-weight: 500;
    }

    .brand-sub {
      color: var(--text-muted);
      font-size: 0.86rem;
      margin-top: 0.4rem;
      margin-bottom: 1.85rem;
      letter-spacing: 0.01em;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .admin-label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #D5D3CC;
      margin-bottom: 0.45rem;
    }

    .admin-input-wrapper {
      position: relative;
    }

    .admin-input-wrapper i.input-icon-left {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #6E6D68;
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .admin-form-control {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      font-size: 0.92rem;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .admin-form-control:focus {
      background: #121317;
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(158, 122, 54, 0.18);
      color: #FFFFFF;
    }

    .admin-form-control:focus + i.input-icon-left {
      color: var(--gold-light);
    }

    .admin-form-control::placeholder {
      color: #55544F;
    }

    .btn-toggle-pw {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #6E6D68;
      cursor: pointer;
      padding: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .btn-toggle-pw:hover {
      color: #FAF8F5;
    }

    .btn-admin-submit {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #A88440 0%, #8A6828 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.8rem 1rem;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(158, 122, 54, 0.25);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 1.6rem;
    }

    .btn-admin-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #B5904A 0%, #98732E 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(158, 122, 54, 0.38);
    }

    .btn-admin-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-admin-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Demo Quick Fill Box */
    .demo-credential-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-credential-box:hover {
      background: rgba(158, 122, 54, 0.08);
      border-color: rgba(158, 122, 54, 0.3);
    }

    .demo-credential-box .demo-info {
      color: #B5B2AA;
      line-height: 1.35;
    }

    .demo-credential-box .demo-info strong {
      color: var(--gold-light);
    }

    .demo-credential-box .badge-autofill {
      background: rgba(158, 122, 54, 0.15);
      color: var(--gold-light);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
      white-space: nowrap;
    }

    .footer-links {
      text-align: center;
      margin-top: 1.75rem;
    }

    .back-to-shop {
      color: #7E7C76;
      font-size: 0.82rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s;
    }

    .back-to-shop:hover {
      color: #FAF8F5;
    }

    .alert-custom {
      background: rgba(198, 40, 40, 0.12);
      border: 1px solid rgba(198, 40, 40, 0.3);
      color: #FF8A80;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      font-size: 0.84rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    @media (max-width: 480px) {
      .admin-login-card {
        padding: 2rem 1.4rem 1.6rem;
      }
      .brand-title {
        font-size: 1.65rem;
      }
    }
  </style>
</head>
<body class="admin-login-body">

<div class="login-container">
  <div class="admin-login-card">
    <div class="text-center">
      <div class="badge-security">
        <i class="bi bi-shield-lock-fill"></i> Area Terotentikasi
      </div>
      <h1 class="brand-title">Albi <span>Admin</span></h1>
      <p class="brand-sub">Panel Manajemen & Operasional Toko</p>
    </div>

    <div id="alert-container"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="admin-label" for="field-email">Email Administrator</label>
        <div class="admin-input-wrapper">
          <input
            type="email"
            id="field-email"
            class="admin-form-control"
            placeholder="nama@albiparfum.com"
            autocomplete="email"
            required
            autofocus
          />
          <i class="bi bi-envelope input-icon-left"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="admin-label" for="field-password">Kata Sandi</label>
        <div class="admin-input-wrapper">
          <input
            type="password"
            id="field-password"
            class="admin-form-control pe-5"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <i class="bi bi-key input-icon-left"></i>
          <button type="button" id="toggle-pw" class="btn-toggle-pw" title="Tampilkan/Sembunyikan password">
            <i class="bi bi-eye" id="pw-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-admin-submit" id="btn-login">
        <span id="btn-text"><i class="bi bi-box-arrow-in-right me-1"></i> Masuk ke Dashboard</span>
        <span id="btn-loading" class="d-none">
          <span class="spinner-border spinner-border-sm me-2"></span>Memproses…
        </span>
      </button>

      <!-- Quick autofill demo credentials -->
      <div class="demo-credential-box" id="btn-autofill" title="Klik untuk mengisi akun demo">
        <div class="demo-info">
          <div><i class="bi bi-info-circle me-1"></i><strong>Akun Akses Demo:</strong></div>
          <div style="font-size:0.73rem;margin-top:2px">admin@albiparfum.com &bull; admin123</div>
        </div>
        <span class="badge-autofill"><i class="bi bi-lightning-charge-fill me-1"></i>Isi Cepat</span>
      </div>
    </form>

    <div class="footer-links">
      <a href="/" class="back-to-shop">
        <i class="bi bi-arrow-left"></i> Kembali ke Katalog Toko
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
/* Redirect if already logged in */
if (localStorage.getItem('albi_admin_token')) {
  location.href = 'dashboard';
}

function getApiBaseAdmin() {
  const path = window.location.pathname;
  let baseFolder = '/';
  if (path.includes('/public/')) {
    baseFolder = path.substring(0, path.indexOf('/public/') + 8);
  }
  const cleanBase = baseFolder.endsWith('/') ? baseFolder : baseFolder + '/';
  return window.location.origin + cleanBase + 'api/admin';
}

// Autofill demo credentials
document.getElementById('btn-autofill').addEventListener('click', () => {
  document.getElementById('field-email').value = 'admin@albiparfum.com';
  document.getElementById('field-password').value = 'admin123';
  document.getElementById('field-email').focus();
});

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  setLoading(true);
  clearAlert();

  const email    = document.getElementById('field-email').value.trim();
  const password = document.getElementById('field-password').value;

  if (!email || !password) {
    showAlert('Harap isi alamat email dan password.');
    setLoading(false);
    return;
  }

  try {
    const res = await axios.post(getApiBaseAdmin() + '/auth/login', { email, password }, {
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
    });

    localStorage.setItem('albi_admin_token', res.data.token);
    localStorage.setItem('albi_admin_user', JSON.stringify(res.data.user));
    if (res.data.user?.role) {
      localStorage.setItem('albi_admin_role', JSON.stringify(res.data.user.role));
    } else {
      localStorage.removeItem('albi_admin_role');
    }
    location.href = 'dashboard';
  } catch (err) {
    const msg = err.response?.data?.message || 'Login gagal. Email atau kata sandi tidak sesuai.';
    showAlert(msg);
    setLoading(false);
  }
});

document.getElementById('toggle-pw').addEventListener('click', () => {
  const pw = document.getElementById('field-password');
  const eye = document.getElementById('pw-eye');
  if (pw.type === 'password') {
    pw.type = 'text';
    eye.className = 'bi bi-eye-slash';
  } else {
    pw.type = 'password';
    eye.className = 'bi bi-eye';
  }
});

function showAlert(msg) {
  document.getElementById('alert-container').innerHTML = `
    <div class="alert-custom">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
      <span>${msg}</span>
    </div>
  `;
}

function clearAlert() {
  document.getElementById('alert-container').innerHTML = '';
}

function setLoading(on) {
  document.getElementById('btn-text').classList.toggle('d-none', on);
  document.getElementById('btn-loading').classList.toggle('d-none', !on);
  document.getElementById('btn-login').disabled = on;
}
</script>
</body>
</html>
