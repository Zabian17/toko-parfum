<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan — Admin Toko Albi Parfum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/admin.css" rel="stylesheet" />
  <style>
    .report-tab-btn {
      padding: .45rem 1.2rem;
      border: 1.5px solid var(--admin-border);
      border-radius: 6px;
      background: #fff;
      font-size: .85rem;
      font-weight: 500;
      color: var(--admin-text);
      cursor: pointer;
      transition: .15s;
    }
    .report-tab-btn.active {
      background: var(--admin-gold);
      border-color: var(--admin-gold);
      color: #fff;
    }
    .report-tab-btn:hover:not(.active) { border-color: var(--admin-gold); color: var(--admin-gold); }
    .report-stat-card { background:#fff; border:1px solid var(--admin-border); border-radius:10px; padding:1rem 1.25rem; }
    .report-stat-card .stat-val { font-size:1.35rem; font-weight:700; color:var(--admin-gold); }
    .report-stat-card .stat-lbl { font-size:.78rem; color:#888; margin-top:2px; }
    .badge-low  { background:#fff3cd; color:#856404; font-size:.72rem; padding:.25em .55em; border-radius:4px; }
    .badge-ok   { background:#d1e7dd; color:#0f5132; font-size:.72rem; padding:.25em .55em; border-radius:4px; }
  </style>
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>
  <div class="admin-main-wrap flex-grow-1">
    <div id="admin-topbar"></div>
    <div class="admin-content">

      <div id="alert-container" class="mb-3"></div>

      <!-- Tab switcher -->
      <div class="d-flex align-items-center gap-2 flex-wrap mb-3">
        <button class="report-tab-btn active" data-tab="transactions"><i class="bi bi-receipt me-1"></i>Transaksi</button>
        <button class="report-tab-btn" data-tab="products"><i class="bi bi-box-seam me-1"></i>Produk Terjual</button>
        <button class="report-tab-btn" data-tab="stock"><i class="bi bi-clipboard-data me-1"></i>Stok Produk</button>
      </div>

      <!-- ===== TRANSAKSI TAB ===== -->
      <div id="tab-transactions">
        <!-- Filter bar -->
        <div class="admin-card mb-3">
          <div class="row g-2 align-items-end p-3">
            <div class="col-auto">
              <label class="admin-form-label">Periode</label>
              <select id="tx-period" class="admin-form-control" style="width:auto">
                <option value="monthly">Per Bulan (12 bulan terakhir)</option>
                <option value="daily">Per Hari (30 hari terakhir)</option>
                <option value="custom">Rentang Tanggal</option>
              </select>
            </div>
            <div id="tx-date-range" class="d-none col-auto d-flex align-items-end gap-2">
              <div>
                <label class="admin-form-label">Dari</label>
                <input type="date" id="tx-date-from" class="admin-form-control" />
              </div>
              <div>
                <label class="admin-form-label">Sampai</label>
                <input type="date" id="tx-date-to" class="admin-form-control" />
              </div>
            </div>
            <div class="col-auto ms-auto d-flex gap-2">
              <button class="btn-admin-outline" id="btn-tx-load"><i class="bi bi-arrow-clockwise me-1"></i>Muat</button>
              <button class="btn-admin-gold" id="btn-tx-excel"><i class="bi bi-file-earmark-excel me-1"></i>Download Excel</button>
            </div>
          </div>
        </div>

        <!-- Stats cards -->
        <div class="row g-2 mb-3" id="tx-stats" style="display:none!important"></div>

        <!-- Table -->
        <div class="admin-card">
          <div id="tx-table-wrap">
            <div class="admin-loading"><span class="spinner-border spinner-border-sm me-2"></span>Memuat laporan…</div>
          </div>
        </div>
      </div>

      <!-- ===== PRODUK TAB ===== -->
      <div id="tab-products" class="d-none">
        <div class="admin-card mb-3">
          <div class="row g-2 align-items-end p-3">
            <div>
              <label class="admin-form-label">Dari</label>
              <input type="date" id="prod-date-from" class="admin-form-control" />
            </div>
            <div>
              <label class="admin-form-label">Sampai</label>
              <input type="date" id="prod-date-to" class="admin-form-control" />
            </div>
            <div class="col-auto ms-auto d-flex gap-2">
              <button class="btn-admin-outline" id="btn-prod-load"><i class="bi bi-arrow-clockwise me-1"></i>Muat</button>
              <button class="btn-admin-gold" id="btn-prod-excel"><i class="bi bi-file-earmark-excel me-1"></i>Download Excel</button>
            </div>
          </div>
        </div>
        <div class="admin-card">
          <div id="prod-table-wrap">
            <div class="admin-loading"><span class="spinner-border spinner-border-sm me-2"></span>Memuat laporan…</div>
          </div>
        </div>
      </div>

      <!-- ===== STOK TAB ===== -->
      <div id="tab-stock" class="d-none">
        <div class="admin-card mb-3">
          <div class="row g-2 align-items-end p-3">
            <div class="col-auto">
              <label class="admin-form-label">Filter</label>
              <select id="stock-filter" class="admin-form-control" style="width:auto">
                <option value="">Semua Produk</option>
                <option value="low">Stok Rendah</option>
                <option value="active">Aktif saja</option>
              </select>
            </div>
            <div class="col-auto ms-auto d-flex gap-2">
              <button class="btn-admin-outline" id="btn-stock-load"><i class="bi bi-arrow-clockwise me-1"></i>Muat</button>
              <button class="btn-admin-gold" id="btn-stock-excel"><i class="bi bi-file-earmark-excel me-1"></i>Download Excel</button>
            </div>
          </div>
        </div>
        <div class="admin-card">
          <div id="stock-stats" class="d-flex gap-3 p-3 border-bottom flex-wrap d-none"></div>
          <div id="stock-table-wrap">
            <div class="admin-loading"><span class="spinner-border spinner-border-sm me-2"></span>Memuat laporan…</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- SheetJS for Excel export -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="js/admin-auth.js"></script>
<script>
/* =====================================================
   reports.html — Page Controller
   ===================================================== */

let txData    = [];
let prodData  = [];
let stockData = [];

document.addEventListener('DOMContentLoaded', () => {
  if (!AdminAuth.requireAuth()) return;
  AdminAuth.buildLayout('Laporan', 'reports');
  initDates();
  bindTabEvents();
  loadTransactions();
  loadProducts();
  loadStock();
});

/* ---- Default date range: first of month to today ---- */
function initDates() {
  const today   = new Date();
  const firstDom = new Date(today.getFullYear(), today.getMonth(), 1);
  const fmt = d => d.toISOString().slice(0, 10);

  document.getElementById('tx-date-from').value   = fmt(firstDom);
  document.getElementById('tx-date-to').value     = fmt(today);
  document.getElementById('prod-date-from').value = fmt(firstDom);
  document.getElementById('prod-date-to').value   = fmt(today);
}

/* ---- Tab switcher ---- */
function bindTabEvents() {
  document.querySelectorAll('.report-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.report-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['transactions', 'products', 'stock'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('d-none', t !== btn.dataset.tab);
      });
    });
  });

  // Period toggle
  document.getElementById('tx-period').addEventListener('change', function() {
    document.getElementById('tx-date-range').classList.toggle('d-none', this.value !== 'custom');
  });

  // Load buttons
  document.getElementById('btn-tx-load').addEventListener('click', loadTransactions);
  document.getElementById('btn-prod-load').addEventListener('click', loadProducts);
  document.getElementById('btn-stock-load').addEventListener('click', loadStock);

  // Excel buttons
  document.getElementById('btn-tx-excel').addEventListener('click',    exportTxExcel);
  document.getElementById('btn-prod-excel').addEventListener('click',  exportProdExcel);
  document.getElementById('btn-stock-excel').addEventListener('click', exportStockExcel);
}

/* ============================================================
   TRANSAKSI
   ============================================================ */
async function loadTransactions() {
  const period   = document.getElementById('tx-period').value;
  const dateFrom = document.getElementById('tx-date-from').value;
  const dateTo   = document.getElementById('tx-date-to').value;

  document.getElementById('tx-table-wrap').innerHTML =
    '<div class="admin-loading"><span class="spinner-border spinner-border-sm me-2"></span>Memuat…</div>';

  try {
    const params = {};
    if (period === 'custom') {
      if (dateFrom) params.date_from = dateFrom;
      if (dateTo)   params.date_to   = dateTo;
    }
    const apiPeriod = period === 'custom' ? 'daily' : period;
    const res = await adminApi.get(`/reports/sales/${apiPeriod}`, { params });
    txData = res.data.data || [];
    const grandTotal = res.data.grand_total || 0;
    const grandCount = res.data.grand_count || 0;

    // Stats
    const statsEl = document.getElementById('tx-stats');
    statsEl.style.removeProperty('display');
    statsEl.classList.remove('d-none');
    statsEl.innerHTML = `
      <div class="col-6 col-md-3">
        <div class="report-stat-card">
          <div class="stat-val">${fmtRp(grandTotal)}</div>
          <div class="stat-lbl">Total Pendapatan</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="report-stat-card">
          <div class="stat-val">${grandCount}</div>
          <div class="stat-lbl">Total Transaksi</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="report-stat-card">
          <div class="stat-val">${grandCount > 0 ? fmtRp(grandTotal / grandCount) : 'Rp 0'}</div>
          <div class="stat-lbl">Rata-rata / Transaksi</div>
        </div>
      </div>
    `;

    if (!txData.length) {
      document.getElementById('tx-table-wrap').innerHTML = '<div class="admin-empty">Tidak ada data transaksi pada periode ini</div>';
      return;
    }

    document.getElementById('tx-table-wrap').innerHTML = `
      <table class="admin-table">
        <thead>
          <tr>
            <th>Periode</th>
            <th class="text-end">Jumlah Transaksi</th>
            <th class="text-end">Total Pendapatan</th>
            <th class="text-end">Rata-rata / Transaksi</th>
          </tr>
        </thead>
        <tbody>
          ${txData.map(row => `
            <tr>
              <td>${escA(row.label)}</td>
              <td class="text-end">${row.count}</td>
              <td class="text-end">${fmtRp(row.total)}</td>
              <td class="text-end">${row.count > 0 ? fmtRp(row.total / row.count) : '—'}</td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr style="font-weight:700;background:#fafafa">
            <td>Total</td>
            <td class="text-end">${grandCount}</td>
            <td class="text-end" style="color:var(--admin-gold)">${fmtRp(grandTotal)}</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    `;
  } catch(e) {
    document.getElementById('tx-table-wrap').innerHTML =
      '<div class="admin-empty text-danger">Gagal memuat laporan transaksi</div>';
  }
}

function exportTxExcel() {
  if (!txData.length) { showAlert('Tidak ada data untuk diexpor', 'warning'); return; }
  const rows = txData.map(r => ({
    'Periode':             r.label,
    'Jumlah Transaksi':    r.count,
    'Total Pendapatan':    Number(r.total),
    'Rata-rata/Transaksi': r.count > 0 ? Math.round(r.total / r.count) : 0,
  }));
  downloadExcel(rows, 'Laporan_Transaksi');
}

/* ============================================================
   PRODUK TERJUAL
   ============================================================ */
async function loadProducts() {
  const dateFrom = document.getElementById('prod-date-from').value;
  const dateTo   = document.getElementById('prod-date-to').value;

  document.getElementById('prod-table-wrap').innerHTML =
    '<div class="admin-loading"><span class="spinner-border spinner-border-sm me-2"></span>Memuat…</div>';

  try {
    const params = {};
    if (dateFrom) params.date_from = dateFrom;
    if (dateTo)   params.date_to   = dateTo;
    const res = await adminApi.get('/reports/products', { params });
    prodData = res.data.data || [];

    if (!prodData.length) {
      document.getElementById('prod-table-wrap').innerHTML = '<div class="admin-empty">Tidak ada data penjualan produk</div>';
      return;
    }

    const totalQty = prodData.reduce((s, r) => s + Number(r.total_qty), 0);
    const totalRev = prodData.reduce((s, r) => s + Number(r.total_revenue), 0);

    document.getElementById('prod-table-wrap').innerHTML = `
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nama Produk</th>
            <th class="text-end">Qty Terjual</th>
            <th class="text-end">Total Pendapatan</th>
          </tr>
        </thead>
        <tbody>
          ${prodData.map((row, i) => `
            <tr>
              <td style="color:#aaa;font-size:.8rem">${i + 1}</td>
              <td>${escA(row.product_name)}</td>
              <td class="text-end">${row.total_qty}</td>
              <td class="text-end">${fmtRp(row.total_revenue)}</td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr style="font-weight:700;background:#fafafa">
            <td colspan="2">Total</td>
            <td class="text-end">${totalQty}</td>
            <td class="text-end" style="color:var(--admin-gold)">${fmtRp(totalRev)}</td>
          </tr>
        </tfoot>
      </table>
    `;
  } catch(e) {
    document.getElementById('prod-table-wrap').innerHTML =
      '<div class="admin-empty text-danger">Gagal memuat laporan produk</div>';
  }
}

function exportProdExcel() {
  if (!prodData.length) { showAlert('Tidak ada data untuk diexpor', 'warning'); return; }
  const rows = prodData.map((r, i) => ({
    'No':                  i + 1,
    'Nama Produk':         r.product_name,
    'Qty Terjual':         Number(r.total_qty),
    'Total Pendapatan':    Number(r.total_revenue),
  }));
  downloadExcel(rows, 'Laporan_Produk_Terjual');
}

/* ============================================================
   STOK
   ============================================================ */
async function loadStock() {
  document.getElementById('stock-table-wrap').innerHTML =
    '<div class="admin-loading"><span class="spinner-border spinner-border-sm me-2"></span>Memuat…</div>';

  try {
    const res = await adminApi.get('/reports/stock');
    let data       = res.data.data || [];
    const lowCount = res.data.low_stock_count || 0;
    const threshold = res.data.threshold || 5;

    // Apply client-side filter
    const filter = document.getElementById('stock-filter').value;
    if (filter === 'low')    data = data.filter(p => p.is_low);
    if (filter === 'active') data = data.filter(p => p.is_active);

    stockData = data;

    // Stats bar
    const statsEl = document.getElementById('stock-stats');
    statsEl.classList.remove('d-none');
    statsEl.innerHTML = `
      <div class="report-stat-card">
        <div class="stat-val">${data.length}</div>
        <div class="stat-lbl">Produk ditampilkan</div>
      </div>
      <div class="report-stat-card">
        <div class="stat-val" style="color:#dc3545">${lowCount}</div>
        <div class="stat-lbl">Stok Rendah (≤ ${threshold})</div>
      </div>
    `;

    if (!data.length) {
      document.getElementById('stock-table-wrap').innerHTML = '<div class="admin-empty">Tidak ada data stok</div>';
      return;
    }

    document.getElementById('stock-table-wrap').innerHTML = `
      <table class="admin-table">
        <thead>
          <tr>
            <th>Nama Produk</th>
            <th>SKU</th>
            <th>Status</th>
            <th class="text-end">Stok Utama</th>
            <th>Varian</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(p => `
            <tr>
              <td>
                <div style="font-weight:600;font-size:.85rem">${escA(p.name)}</div>
              </td>
              <td style="font-size:.8rem;color:#888">${escA(p.sku || '—')}</td>
              <td>${p.is_active ? '<span class="badge-ok">Aktif</span>' : '<span style="background:#f8d7da;color:#842029;font-size:.72rem;padding:.25em .55em;border-radius:4px">Nonaktif</span>'}</td>
              <td class="text-end">
                <span class="${p.is_low ? 'badge-low' : ''}" style="font-weight:600">${p.stock}</span>
              </td>
              <td style="font-size:.8rem">
                ${p.variants && p.variants.length
                  ? p.variants.map(v => `
                      <span class="me-2">${escA(v.name)}: <strong class="${v.is_low ? 'badge-low' : ''}">${v.stock}</strong></span>
                    `).join('')
                  : '<span style="color:#bbb">—</span>'}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch(e) {
    document.getElementById('stock-table-wrap').innerHTML =
      '<div class="admin-empty text-danger">Gagal memuat laporan stok</div>';
  }
}

function exportStockExcel() {
  if (!stockData.length) { showAlert('Tidak ada data untuk diexpor', 'warning'); return; }
  const rows = [];
  stockData.forEach(p => {
    if (p.variants && p.variants.length) {
      p.variants.forEach(v => {
        rows.push({
          'Nama Produk': p.name,
          'SKU':         p.sku || '',
          'Status':      p.is_active ? 'Aktif' : 'Nonaktif',
          'Varian':      v.name,
          'Stok Varian': v.stock,
          'Stok Utama':  p.stock,
          'Stok Rendah': v.is_low ? 'Ya' : 'Tidak',
        });
      });
    } else {
      rows.push({
        'Nama Produk': p.name,
        'SKU':         p.sku || '',
        'Status':      p.is_active ? 'Aktif' : 'Nonaktif',
        'Varian':      '',
        'Stok Varian': '',
        'Stok Utama':  p.stock,
        'Stok Rendah': p.is_low ? 'Ya' : 'Tidak',
      });
    }
  });
  downloadExcel(rows, 'Laporan_Stok');
}

/* ============================================================
   Excel helper (SheetJS)
   ============================================================ */
function downloadExcel(rows, filename) {
  const ws = XLSX.utils.json_to_sheet(rows);

  // Auto-width columns
  const colWidths = Object.keys(rows[0] || {}).map(key => {
    const maxLen = Math.max(
      key.length,
      ...rows.map(r => String(r[key] ?? '').length)
    );
    return { wch: Math.min(maxLen + 2, 50) };
  });
  ws['!cols'] = colWidths;

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Laporan');
  XLSX.writeFile(wb, `${filename}_${new Date().toISOString().slice(0, 10)}.xlsx`);
}
</script>
</body>
</html>
