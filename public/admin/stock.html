<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stok — Admin Toko Albi Parfum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet" />
  <link href="css/admin.css" rel="stylesheet" />
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>
  <div class="admin-main-wrap flex-grow-1">
    <div id="admin-topbar"></div>
    <div class="admin-content">

      <div id="alert-container" class="mb-3"></div>

      <!-- Toolbar -->
      <div class="d-flex align-items-center gap-2 flex-wrap mb-3">
        <div class="admin-search" style="flex:1;min-width:200px;max-width:320px">
          <input type="text" id="search-input" placeholder="Nama produk, SKU…" />
          <button id="search-btn"><i class="bi bi-search"></i></button>
        </div>
        <select id="filter-stock" class="admin-form-control" style="width:auto">
          <option value="">Semua Stok</option>
          <option value="low">Stok Rendah</option>
          <option value="out">Habis</option>
        </select>
      </div>

      <div class="admin-card">
        <div id="stock-table"></div>
      </div>

    </div>
  </div>
</div>

<!-- ADJUST STOCK MODAL -->
<div class="modal fade" id="adjustModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Sesuaikan Stok</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="adjust-product-info" class="mb-3 p-2" style="background:#f8f8f8;border-radius:6px;font-size:0.85rem"></div>
        <input type="hidden" id="adjust-product-id">
        <input type="hidden" id="adjust-variant-id">

        <div class="admin-form-group">
          <label class="admin-form-label">Tipe <span class="text-danger">*</span></label>
          <select id="adjust-type" class="admin-form-control">
            <option value="in">Masuk (+)</option>
            <option value="out">Keluar (-)</option>
            <option value="adjustment">Koreksi (Set absolut)</option>
          </select>
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label">Jumlah <span class="text-danger">*</span></label>
          <input type="number" id="adjust-qty" class="admin-form-control" min="0" placeholder="0" />
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label">Alasan</label>
          <input type="text" id="adjust-reason" class="admin-form-control" placeholder="Restock, retur, koreksi…" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-admin-outline" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn-admin-gold" id="btn-save-adjust">
          <span id="save-text">Simpan</span>
          <span class="spinner-border spinner-border-sm d-none" id="save-spinner"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<script src="js/admin-auth.js"></script>
<script>
const adjustModal = new bootstrap.Modal(document.getElementById('adjustModal'));
let table;

document.addEventListener('DOMContentLoaded', () => {
  if (!AdminAuth.requireAuth()) return;
  AdminAuth.buildLayout('Manajemen Stok', 'stock');
  initTable();
  bindEvents();
});

function initTable() {
  table = new Tabulator('#stock-table', {
    ajaxURL: '/api/admin/stock/levels',
    ajaxRequestFunc: function(url, config, params) {
      const p = { page: params.page || 1, per_page: params.size || 10 };
      const remoteFilters = params.filter || params.filters || [];
      const remoteSorters = params.sort || params.sorters || [];
      const search      = document.getElementById('search-input').value.trim();
      const stockFilter = document.getElementById('filter-stock').value;
      if (search)      p.search       = search;
      if (stockFilter) p.stock_filter = stockFilter;
      if (remoteFilters.length) p.filters = JSON.stringify(remoteFilters);
      if (remoteSorters.length) p.sorters = JSON.stringify(remoteSorters);
      return axios.get(url, {
        headers: { 'Authorization': 'Bearer ' + AdminAuth.token(), 'Accept': 'application/json' },
        params: p,
      }).then(function(res) {
        const r = res.data;
        return { data: r.data ?? r, last_page: r.meta?.last_page ?? r.last_page ?? 1 };
      });
    },
    pagination: true,
    paginationMode: 'remote',
    filterMode: 'remote',
    sortMode: 'remote',
    paginationSize: 50,
    paginationSizeSelector: [10, 20, 50],
    layout: 'fitColumns',
    resizableColumns: true,
    placeholder: '<div class="admin-empty"><i class="bi bi-box-seam"></i><br>Tidak ada item</div>',
    columns: [
      {
        title: 'Produk',
        field: 'product_name',
        headerFilter: 'input',
        formatter: function(cell) {
          const item = cell.getRow().getData();
          const imgUrl = item.thumbnail ? resolveAssetUrl(item.thumbnail) : '';
          const thumbHtml = imgUrl
            ? `<img src="${imgUrl}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid #eee;margin-right:10px;vertical-align:middle" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex';" /><div style="display:none;width:36px;height:36px;border-radius:6px;background:#f5f0e8;border:1px solid #eee;align-items:center;justify-content:center;color:#c9a84c;margin-right:10px;vertical-align:middle"><i class="bi bi-droplet-fill"></i></div>`
            : `<div style="display:inline-flex;width:36px;height:36px;border-radius:6px;background:#f5f0e8;border:1px solid #eee;align-items:center;justify-content:center;color:#c9a84c;margin-right:10px;vertical-align:middle"><i class="bi bi-droplet-fill"></i></div>`;
          return `<div style="display:flex;align-items:center">${thumbHtml}<strong style="font-size:0.85rem">${escA(item.product_name || item.name || '—')}</strong></div>`;
        },
        minWidth: 160,
      },
      {
        title: 'Varian',
        field: 'variant_name',
        headerFilter: 'input',
        formatter: function(cell) {
          return `<span style="font-size:0.82rem;color:#666">${escA(cell.getValue() || '—')}</span>`;
        },
        width: 170,
      },
      {
        title: 'Stok',
        field: 'stock',
        hozAlign: 'center',
        width: 120,
        formatter: function(cell) {
          const qty = cell.getValue() ?? 0;
          const color = qty === 0 ? '#c0392b' : qty <= 5 ? '#d68000' : '#2e7d32';
          return `<span style="font-weight:700;font-size:0.9rem;color:${color}">${qty}</span>`;
        },
      },
      {
        title: 'Status',
        field: 'stock',
        hozAlign: 'center',
        width: 120,
        headerSort: false,
        formatter: function(cell) {
          const qty = cell.getValue() ?? 0;
          if (qty === 0) return '<span class="badge-status status-cancelled">Habis</span>';
          if (qty <= 5)  return '<span class="badge-status status-pending">Rendah</span>';
          return '<span class="badge-status status-active">Tersedia</span>';
        },
      },
      {
        title: '',
        field: 'product_id',
        headerSort: false,
        width: 120,
        formatter: function(cell) {
          const item = cell.getRow().getData();
          return `<button class="btn-action btn-edit"
            data-product-id="${item.product_id || item.id}"
            data-variant-id="${item.variant_id || ''}"
            data-name="${escA(item.product_name || item.name)}"
            data-variant="${escA(item.variant_name || '')}"
            data-stock="${item.stock ?? 0}"
            title="Sesuaikan Stok">
            <i class="bi bi-pencil"></i>
          </button>`;
        },
        cellClick: function(e, cell) {
          const btn = e.target.closest('.btn-edit');
          if (btn) openAdjust(btn);
        },
      },
    ],
  });
}

function bindEvents() {
  const doSearch = debounce(() => table.setData(), 400);
  document.getElementById('search-input').addEventListener('input', doSearch);
  document.getElementById('search-btn').addEventListener('click', () => table.setData());
  document.getElementById('filter-stock').addEventListener('change', () => table.setData());
  document.getElementById('btn-save-adjust').addEventListener('click', saveAdjust);
}

function openAdjust(btn) {
  document.getElementById('adjust-product-id').value = btn.dataset.productId;
  document.getElementById('adjust-variant-id').value = btn.dataset.variantId || '';
  document.getElementById('adjust-type').value = 'in';
  document.getElementById('adjust-qty').value = '';
  document.getElementById('adjust-reason').value = '';
  document.getElementById('adjust-product-info').innerHTML = `
    <strong>${escA(btn.dataset.name)}</strong>
    ${btn.dataset.variant ? ` — <span style="color:#888">${escA(btn.dataset.variant)}</span>` : ''}
    <span style="float:right;font-weight:700">Stok saat ini: ${escA(btn.dataset.stock)}</span>
  `;
  adjustModal.show();
}

async function saveAdjust() {
  const qty = parseInt(document.getElementById('adjust-qty').value);
  if (isNaN(qty) || qty < 0) { showAlert('Masukkan jumlah yang valid', 'error'); return; }

  const payload = {
    product_id:          document.getElementById('adjust-product-id').value,
    product_variant_id:  document.getElementById('adjust-variant-id').value || null,
    type:                document.getElementById('adjust-type').value,
    quantity:            qty,
    notes:               document.getElementById('adjust-reason').value.trim() || null,
  };

  document.getElementById('save-text').classList.add('d-none');
  document.getElementById('save-spinner').classList.remove('d-none');
  document.getElementById('btn-save-adjust').disabled = true;

  try {
    await adminApi.post('/stock/adjust', payload);
    adjustModal.hide();
    showAlert('Stok berhasil disesuaikan');
    table.setData();
  } catch(e) {
    showAlert(e.response?.data?.message || 'Gagal menyimpan perubahan stok', 'error');
  } finally {
    document.getElementById('save-text').classList.remove('d-none');
    document.getElementById('save-spinner').classList.add('d-none');
    document.getElementById('btn-save-adjust').disabled = false;
  }
}

function debounce(fn, delay = 300) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
}
</script>
</body>
</html>
