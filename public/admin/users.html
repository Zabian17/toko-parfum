<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manajemen User — Admin Toko Albi Parfum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/admin.css" rel="stylesheet" />
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>
  <div class="admin-main-wrap flex-grow-1">
    <div id="admin-topbar"></div>
    <div class="admin-content">

      <div id="alert-container" class="mb-3"></div>

      <!-- Header -->
      <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
          <h5 class="fw-semibold mb-0">Manajemen User</h5>
          <p class="text-muted small mb-0">Kelola akun admin dan tugaskan role</p>
        </div>
        <button class="btn-admin-gold ms-auto" id="btn-add-user">
          <i class="bi bi-person-plus me-1"></i>Tambah User
        </button>
      </div>

      <!-- Table -->
      <div class="admin-card">
        <div id="users-loading" class="admin-loading"><span class="spinner-border spinner-border-sm me-2"></span>Memuat data…</div>
        <div id="users-empty" class="admin-empty d-none">
          <i class="bi bi-people fs-1 text-muted"></i>
          <p class="mt-2 text-muted">Belum ada user.</p>
        </div>
        <div class="table-responsive d-none" id="users-table-wrap">
          <table class="admin-table w-100">
            <thead>
              <tr>
                <th>Nama</th>
                <th>Email</th>
                <th>Role</th>
                <th>Terdaftar</th>
                <th class="text-end">Aksi</th>
              </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
      </div>

    </div><!-- /.admin-content -->
  </div>
</div>

<!-- ============================================================
     Modal: Add / Edit User
     ============================================================ -->
<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="userModalLabel">Tambah User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="user-form" novalidate>
          <input type="hidden" id="user-id" />

          <div class="admin-form-group mb-3">
            <label class="admin-form-label">Nama <span class="text-danger">*</span></label>
            <input type="text" id="user-name" class="admin-form-control" required />
          </div>

          <div class="admin-form-group mb-3">
            <label class="admin-form-label">Email <span class="text-danger">*</span></label>
            <input type="email" id="user-email" class="admin-form-control" required />
          </div>

          <div class="admin-form-group mb-3">
            <label class="admin-form-label" id="password-label">
              Password <span class="text-danger" id="password-required">*</span>
            </label>
            <div class="input-group">
              <input type="password" id="user-password" class="form-control admin-form-control" autocomplete="new-password" />
              <button class="btn btn-outline-secondary" type="button" id="btn-toggle-password" tabindex="-1">
                <i class="bi bi-eye" id="password-eye-icon"></i>
              </button>
            </div>
            <small id="password-hint" class="text-muted d-none">Kosongkan jika tidak ingin mengubah password.</small>
          </div>

          <div class="admin-form-group mb-3">
            <label class="admin-form-label">Role</label>
            <select id="user-role" class="admin-form-control">
              <option value="">— Tidak ada role —</option>
            </select>
          </div>

        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="admin-btn admin-btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn-admin-gold ms-auto" id="btn-save-user">
          <span id="save-user-spinner" class="spinner-border spinner-border-sm me-1 d-none"></span>
          Simpan
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/admin-auth.js"></script>
<script>
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', pageInit);
} else {
  pageInit();
}

function pageInit() {
  if (!AdminAuth.requireAuth()) return;
  if (!AdminAuth.hasPermission('users')) {
    location.href = 'dashboard';
    return;
  }
  AdminAuth.buildLayout('Manajemen User', 'users');
  loadRolesDropdown();
  loadUsers();
  bindEvents();
}

let userModal;
let rolesCache = [];

/* ============================================================
   Bind UI events
   ============================================================ */
function bindEvents() {
  userModal = new bootstrap.Modal(document.getElementById('userModal'));
  document.getElementById('btn-add-user').addEventListener('click', openCreateModal);
  document.getElementById('btn-save-user').addEventListener('click', saveUser);

  document.getElementById('btn-toggle-password').addEventListener('click', function () {
    const input = document.getElementById('user-password');
    const icon  = document.getElementById('password-eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'bi bi-eye';
    }
  });
}

/* ============================================================
   Load roles for dropdown
   ============================================================ */
async function loadRolesDropdown() {
  try {
    const res = await adminApi.get('/roles');
    rolesCache = res.data.data || [];
    const sel = document.getElementById('user-role');
    const currentUser = AdminAuth.user();
    const isSuper = currentUser?.role?.is_super ?? false;
    const visibleRoles = isSuper ? rolesCache : rolesCache.filter(r => !r.is_super);

    visibleRoles.forEach(role => {
      const opt = document.createElement('option');
      opt.value = role.id;
      opt.textContent = role.name;
      sel.appendChild(opt);
    });
  } catch (e) {
    // non-critical fail
  }
}

/* ============================================================
   Load users
   ============================================================ */
async function loadUsers() {
  showTableState('loading');
  try {
    const res = await adminApi.get('/users');
    const users = res.data.data || [];
    if (users.length === 0) {
      showTableState('empty');
    } else {
      renderTable(users);
      showTableState('table');
    }
  } catch (e) {
    showAlert('Gagal memuat data user.', 'error');
    showTableState('empty');
  }
}

function showTableState(state) {
  document.getElementById('users-loading').classList.toggle('d-none', state !== 'loading');
  document.getElementById('users-empty').classList.toggle('d-none', state !== 'empty');
  document.getElementById('users-table-wrap').classList.toggle('d-none', state !== 'table');
}

function renderTable(users) {
  const currentUser = AdminAuth.user();
  const tbody = document.getElementById('users-tbody');
  tbody.innerHTML = users.map(u => {
    const roleBadge = u.role
      ? (u.role.is_super
          ? `<span class="badge bg-danger">${escA(u.role.name)}</span>`
          : `<span class="badge bg-primary">${escA(u.role.name)}</span>`)
      : `<span class="badge bg-light text-muted border">—</span>`;

    const isSelf = currentUser && u.id === currentUser.id;
    const deleteBtn = isSelf
      ? `<button class="admin-btn admin-btn-sm admin-btn-danger" disabled title="Tidak dapat menghapus akun sendiri"><i class="bi bi-trash"></i></button>`
      : `<button class="btn-action btn-delete" onclick="deleteUser(${u.id}, '${escA(u.name)}')"><i class="bi bi-trash"></i></button>`;

    return `
      <tr>
        <td class="fw-medium">
          ${escA(u.name)}
          ${isSelf ? '<span class="badge bg-light text-muted border ms-1">Saya</span>' : ''}
        </td>
        <td>${escA(u.email)}</td>
        <td>${roleBadge}</td>
        <td>${fmtDate(u.created_at)}</td>
        <td class="text-end">
          <button class="btn-action btn-edit" onclick="openEditModal(${u.id})">
            <i class="bi bi-pencil"></i>
          </button>
          ${deleteBtn}
        </td>
      </tr>
    `;
  }).join('');
}

/* ============================================================
   Create / Edit modal
   ============================================================ */
function openCreateModal() {
  document.getElementById('user-form').reset();
  document.getElementById('user-id').value = '';
  document.getElementById('userModalLabel').textContent = 'Tambah User';
  document.getElementById('password-required').classList.remove('d-none');
  document.getElementById('password-hint').classList.add('d-none');
  document.getElementById('user-role').value = '';
  userModal.show();
}

async function openEditModal(id) {
  try {
    const res = await adminApi.get(`/users/${id}`);
    const u = res.data.data;

    document.getElementById('user-id').value = u.id;
    document.getElementById('user-name').value = u.name;
    document.getElementById('user-email').value = u.email;
    document.getElementById('user-password').value = '';
    const roleSel = document.getElementById('user-role');
    // If the current user cannot see super roles, the user's role may not be present
    // in the dropdown — fall back to empty selection in that case.
    if (roleSel.querySelector(`option[value="${u.role_id}"]`)) {
      roleSel.value = u.role_id || '';
    } else {
      roleSel.value = '';
    }
    document.getElementById('userModalLabel').textContent = 'Edit User';
    document.getElementById('password-required').classList.add('d-none');
    document.getElementById('password-hint').classList.remove('d-none');
    userModal.show();
  } catch (e) {
    showAlert('Gagal memuat data user.', 'error');
  }
}

async function saveUser() {
  const id       = document.getElementById('user-id').value;
  const name     = document.getElementById('user-name').value.trim();
  const email    = document.getElementById('user-email').value.trim();
  const password = document.getElementById('user-password').value;
  const roleId   = document.getElementById('user-role').value;

  if (!name || !email) {
    showAlert('Nama dan email wajib diisi.', 'warning');
    return;
  }
  if (!id && !password) {
    showAlert('Password wajib untuk user baru.', 'warning');
    return;
  }

  const spinner = document.getElementById('save-user-spinner');
  spinner.classList.remove('d-none');

  try {
    const payload = { name, email, role_id: roleId || null };
    if (password) payload.password = password;

    if (id) {
      await adminApi.put(`/users/${id}`, payload);
      showAlert('User berhasil diperbarui.');
    } else {
      await adminApi.post('/users', payload);
      showAlert('User berhasil ditambahkan.');
    }
    userModal.hide();
    loadUsers();
  } catch (e) {
    const errors = e.response?.data?.errors;
    const msg = errors
      ? Object.values(errors).flat().join(' ')
      : (e.response?.data?.message || 'Gagal menyimpan user.');
    showAlert(msg, 'error');
  } finally {
    spinner.classList.add('d-none');
  }
}

async function deleteUser(id, name) {
  if (!confirm(`Hapus user "${name}"? Aksi ini tidak bisa dibatalkan.`)) return;
  try {
    await adminApi.delete(`/users/${id}`);
    showAlert('User dihapus.');
    loadUsers();
  } catch (e) {
    const msg = e.response?.data?.message || 'Gagal menghapus user.';
    showAlert(msg, 'error');
  }
}
</script>
</body>
</html>
